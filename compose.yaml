services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: true
      TELEGRAM_HTTP_PORT: ${TELEGRAM_HTTP_PORT}
    volumes:
      - telegram-bot-data:/var/lib/telegram-bot-api
    ports:
      - "${TELEGRAM_HTTP_PORT}:${TELEGRAM_HTTP_PORT}"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - telegram-bot-data:/var/lib/telegram-bot-api
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_API_BASE_URL=http://telegram-bot-api:${TELEGRAM_HTTP_PORT}
      - BOT_FILES_DIR=/var/lib/telegram-bot-api/${BOT_TOKEN}
      - JS_RUNTIME=node
volumes:
  telegram-bot-data: